name: KV observability native prerequisites

on:
  push:
    branches:
      - kastan/kv-observability-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-receipts:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CI: "true"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Configure sccache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y ninja-build
          sudo bash -x dependencies.sh -y
      - name: Configure CPU native tests
        run: |
          cmake -S . -B build-kv -G Ninja -DUSE_CUDA=OFF -DUSE_HTTP=ON \
            -DBUILD_UNIT_TESTS=ON -DBUILD_EXAMPLES=OFF \
            -DENABLE_SCCACHE=ON -DENABLE_DEBUG_SYMBOLS=OFF
      - name: Build native prerequisites
        run: cmake --build build-kv --target pybind_client_test master_metrics_test
      - name: Execute successful-read receipts over TCP
        run: |
          build-kv/mooncake-store/tests/pybind_client_test --protocol=tcp \
            --gtest_filter=RealClientTest.BatchReadReceiptsFollowSuccessfulSelectedReplica
      - name: Execute bounded eviction metadata accounting
        run: |
          build-kv/mooncake-store/tests/master_metrics_test \
            --gtest_filter=MasterMetricsTest.ReplicaEvictionsKeepSurvivingMetadataSeparateAndLabelsBounded
